<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#301934" />
      <stop offset="40%" stop-color="#58355e" />
      <stop offset="80%" stop-color="#8e44ad" />
      <stop offset="100%" stop-color="#ff758c" />
    </linearGradient>
  </defs>
  <rect width="600" height="500" fill="url(#bgGrad4)" />

  <!-- Crescent Golden Moon & Cloud -->
  <g transform="translate(300, 180)">
    <circle cx="0" cy="0" r="65" fill="#fef08a" opacity="0.9" filter="drop-shadow(0 0 20px #fef08a)"/>
    <circle cx="24" cy="-12" r="56" fill="#4a2550" />
    <text x="25" y="30" font-size="40">✨</text>
  </g>

  <!-- Stars -->
  <circle cx="100" cy="80" r="3" fill="#ffffff" />
  <circle cx="160" cy="140" r="2" fill="#ffffff" />
  <circle cx="220" cy="70" r="3" fill="#ffd700" />
  <circle cx="450" cy="100" r="3" fill="#ffffff" />
  <circle cx="500" cy="180" r="2" fill="#ffd700" />
  <circle cx="480" cy="60" r="3.5" fill="#ffffff" />
  <circle cx="140" cy="260" r="2" fill="#ffffff" />
  <circle cx="460" cy="270" r="2.5" fill="#ffffff" />

  <text x="300" y="380" font-family="'Playfair Display', serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">STARRY WISHES</text>
  <text x="300" y="415" font-family="'Poppins', sans-serif" font-size="16" fill="rgba(255,255,255,0.85)" text-anchor="middle">You outshine all the stars in the night</text>
</svg>

