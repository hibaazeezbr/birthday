<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>
  <rect width="600" height="500" fill="url(#bgGrad5)" />

  <!-- Heart Balloons floating -->
  <g transform="translate(250, 190)">
    <path d="M 0,-30 C -30,-70 -80,-30 -80,10 C -80,50 0,90 0,110 C 0,90 80,50 80,10 C 80,-30 30,-70 0,-30 Z" fill="#f43f5e" opacity="0.85" transform="scale(0.8) rotate(-10)"/>
    <path d="M 0,90 Q -10,130 5,160" stroke="#f43f5e" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  <g transform="translate(360, 160)">
    <path d="M 0,-30 C -30,-70 -80,-30 -80,10 C -80,50 0,90 0,110 C 0,90 80,50 80,10 C 80,-30 30,-70 0,-30 Z" fill="#c084fc" opacity="0.85" transform="scale(0.7) rotate(12)"/>
    <path d="M 0,80 Q 15,120 0,150" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  <g transform="translate(310, 240)">
    <path d="M 0,-30 C -30,-70 -80,-30 -80,10 C -80,50 0,90 0,110 C 0,90 80,50 80,10 C 80,-30 30,-70 0,-30 Z" fill="#fb7185" opacity="0.9" transform="scale(0.65)"/>
  </g>

  <!-- Fluffy clouds -->
  <path d="M 60,330 Q 90,290 140,310 Q 180,280 230,310 Q 270,330 250,360 L 60,360 Z" fill="#ffffff" opacity="0.5" />
  <path d="M 370,340 Q 400,290 460,310 Q 510,290 550,330 Q 560,360 520,370 L 370,370 Z" fill="#ffffff" opacity="0.5" />

  <text x="300" y="405" font-family="'Playfair Display', serif" font-weight="bold" font-size="28" fill="#831843" text-anchor="middle" letter-spacing="3">FLOATING DREAMS</text>
  <text x="300" y="440" font-family="'Poppins', sans-serif" font-size="16" fill="#9d174d" text-anchor="middle">May your hopes soar higher than the clouds</text>
</svg>

