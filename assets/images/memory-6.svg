<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1eb" />
      <stop offset="50%" stop-color="#ace0f9" />
      <stop offset="100%" stop-color="#fbc2eb" />
    </linearGradient>
  </defs>
  <rect width="600" height="500" fill="url(#bgGrad6)" />

  <!-- Cozy coffee cup with heart latte art & open diary -->
  <g transform="translate(300, 210)">
    <!-- Saucer -->
    <ellipse cx="0" cy="60" rx="70" ry="20" fill="#ffffff" opacity="0.8" />
    <!-- Cup -->
    <path d="M -45,15 C -45,55 45,55 45,15 Z" fill="#ffffff" />
    <!-- Handle -->
    <path d="M 40,20 C 58,20 58,45 40,48" stroke="#ffffff" stroke-width="6" fill="none" />
    <!-- Coffee surface -->
    <ellipse cx="0" cy="15" rx="42" ry="14" fill="#a0522d" />
    <!-- Foam heart -->
    <path d="M 0,10 C -5,5 -14,10 -10,16 C -6,22 0,25 0,25 C 0,25 6,22 10,16 C 14,10 5,5 0,10 Z" fill="#ffffff" transform="scale(0.8) translate(0, 5)"/>
  </g>

  <!-- Steam swirls -->
  <path d="M 290,140 Q 280,110 295,90" stroke="rgba(255,255,255,0.7)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 310,135 Q 325,105 310,85" stroke="rgba(255,255,255,0.7)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Romantic touches -->
  <text x="140" y="240" font-size="36">📖</text>
  <text x="440" y="230" font-size="36">💌</text>
  <text x="190" y="130" font-size="30">✨</text>
  <text x="420" y="320" font-size="30">🌸</text>

  <text x="300" y="380" font-family="'Playfair Display', serif" font-weight="bold" font-size="28" fill="#4a154b" text-anchor="middle" letter-spacing="3">WARM &amp; CHERISHED</text>
  <text x="300" y="415" font-family="'Poppins', sans-serif" font-size="16" fill="#6a3d72" text-anchor="middle">Every cozy conversation with you is treasure</text>
</svg>

