<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd1dc" />
      <stop offset="50%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#c3bef0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="500" fill="url(#bgGrad1)" />
  
  <!-- Fairy Lights string -->
  <path d="M 0,80 Q 150,150 300,90 T 600,100" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" />
  <circle cx="80" cy="115" r="8" fill="#fff7b2" filter="url(#glow)" />
  <circle cx="160" cy="130" r="9" fill="#ffccd5" filter="url(#glow)" />
  <circle cx="240" cy="110" r="8" fill="#e0c3fc" filter="url(#glow)" />
  <circle cx="340" cy="98" r="9" fill="#fff7b2" filter="url(#glow)" />
  <circle cx="430" cy="108" r="8" fill="#ffd1dc" filter="url(#glow)" />
  <circle cx="520" cy="100" r="9" fill="#e0c3fc" filter="url(#glow)" />

  <!-- Soft bokeh circles -->
  <circle cx="120" cy="350" r="60" fill="rgba(255, 255, 255, 0.25)" />
  <circle cx="480" cy="380" r="80" fill="rgba(255, 240, 245, 0.3)" />
  <circle cx="300" cy="220" r="100" fill="rgba(255, 255, 255, 0.2)" />

  <!-- Sparkling stars and hearts -->
  <text x="300" y="270" font-size="80" text-anchor="middle" filter="url(#glow)">✨</text>
  <text x="210" y="320" font-size="45" text-anchor="middle">🌸</text>
  <text x="390" y="320" font-size="45" text-anchor="middle">💖</text>
  <text x="300" y="380" font-family="'Playfair Display', serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">FAIRY TALE MOMENTS</text>
  <text x="300" y="415" font-family="'Poppins', sans-serif" font-size="16" fill="rgba(255,255,255,0.9)" text-anchor="middle">Illuminated by your bright smile</text>
</svg>

